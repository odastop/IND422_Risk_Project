<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Startup Risk & Opportunity Radar{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{{ url_for('index') }}" class="logo">🧭 Risk &amp; Opportunity Radar</a>
            <p class="tagline">A quick MVP to help startups spot risks, opportunities and next steps</p>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Student project (IND422) &middot; Results are based on mock/demo data, not real analysis.</p>
        </div>
    </footer>
</body>
</html>
